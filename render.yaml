services:
  - type: web
    name: sartaroshxona-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ESKIZ_EMAIL
        value: ""
      - key: ESKIZ_PASSWORD
        value: ""
